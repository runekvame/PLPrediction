<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLPrediction - Logg inn</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h1>PLPrediction</h1>
            <p>Logg inn for å fortsette</p>

            <div id="alert" class="alert" style="display:none"></div>

            <!-- Login form -->
            <div id="login-form">
                <div class="form-group">
                    <label>E-post</label>
                    <input type="email" id="login-email" placeholder="din@epost.no">
                </div>
                <div class="form-group">
                    <label>Passord</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button onclick="handleLogin()" style="width:100%">Logg inn</button>
                <div class="auth-toggle">
                    Har du ikke konto? <span onclick="showRegister()">Registrer deg</span>
                </div>
            </div>

            <!-- Register form -->
            <div id="register-form" style="display:none">
                <div class="form-group">
                    <label>Brukernavn</label>
                    <input type="text" id="reg-username" placeholder="dittbrukernavn">
                </div>
                <div class="form-group">
                    <label>E-post</label>
                    <input type="email" id="reg-email" placeholder="din@epost.no">
                </div>
                <div class="form-group">
                    <label>Passord</label>
                    <input type="password" id="reg-password" placeholder="••••••••">
                </div>
                <button onclick="handleRegister()" style="width:100%">Registrer</button>
                <div class="auth-toggle">
                    Har du allerede konto? <span onclick="showLogin()">Logg inn</span>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
