<!doctype html>
<html lang="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLPrediction - Profil</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <nav>
      <a href="home.html" class="logo">PLPrediction</a>
      <button class="nav-hamburger" onclick="toggleNav()">☰</button>
      <ul id="nav-menu">
        <li><a href="home.html">Hjem</a></li>
        <li><a href="predictions.html">Tippinger</a></li>
        <li><a href="leaderboard.html">Tabell</a></li>
        <li>
          <a href="admin.html" id="admin-link" style="display: none">Admin</a>
        </li>
      </ul>
      <div class="nav-right">
        <span class="nav-username" id="nav-username"></span>
        <div class="nav-avatar">
          <button
            class="nav-avatar-btn"
            id="avatar-btn"
            onclick="toggleDropdown()"
          >
            ?
          </button>
          <div class="nav-dropdown" id="nav-dropdown">
            <div class="nav-dropdown-header" id="dropdown-username">
              Laster...
            </div>
            <button class="nav-dropdown-item danger" onclick="logout()">
              Logg ut
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main>
      <div class="page-header">
        <h1>Profil</h1>
        <p>Administrer profilbildet ditt</p>
      </div>

      <div class="card" style="max-width: 480px; margin: 0 auto">
        <!-- Current avatar display -->
        <div class="profile-avatar-section">
          <div class="profile-avatar-wrapper">
            <div class="profile-avatar-container">
              <div
                class="skeleton profile-avatar-skeleton"
                id="avatar-skeleton"
              ></div>
              <img
                id="profile-avatar-img"
                class="profile-avatar-img"
                src=""
                alt="Profilbilde"
                style="display: none"
              />
              <div
                class="profile-avatar-initials"
                id="profile-avatar-initials"
                style="display: none"
              ></div>
            </div>
            <button
              class="profile-avatar-edit-btn"
              onclick="document.getElementById('avatar-file-input').click()"
              title="Endre profilbilde"
            >
              ✏️
            </button>
          </div>
          <div class="profile-username" id="profile-username">
            <div
              class="skeleton skeleton-text"
              style="width: 120px; height: 1.4rem; margin: 0 auto"
            ></div>
          </div>
          <div class="profile-points" id="profile-points" style="display: none">
            <span id="profile-points-value"></span> poeng totalt
          </div>
        </div>

        <!-- Hidden file input -->
        <input
          type="file"
          id="avatar-file-input"
          accept="image/*"
          style="display: none"
          onchange="handleAvatarSelect(event)"
        />

        <!-- Crop section -->
        <div id="crop-section" style="display: none">
          <div class="profile-section-label" style="margin-bottom: 0.5rem">
            Dra for å justere utsnitt
          </div>

          <!-- Interactive crop canvas -->
          <div
            style="
              border-radius: 10px;
              overflow: hidden;
              border: 1px solid var(--border);
              margin-bottom: 1rem;
            "
          >
            <canvas
              id="crop-canvas"
              style="display: block; width: 100%"
            ></canvas>
          </div>

          <!-- Circle previews -->
          <div
            class="profile-crop-preview-sizes"
            style="
              flex-direction: row;
              justify-content: center;
              gap: 1.5rem;
              margin-bottom: 1.25rem;
            "
          >
            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
              "
            >
              <img
                id="crop-preview-circle"
                class="profile-preview-circle preview-large"
                src=""
                alt=""
              />
              <span class="profile-crop-size-label">Stor</span>
            </div>
            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
              "
            >
              <img
                id="preview-large"
                class="profile-preview-circle"
                style="width: 40px; height: 40px"
                src=""
                alt=""
              />
              <span class="profile-crop-size-label">Medium</span>
            </div>
            <div
              style="
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.4rem;
              "
            >
              <img
                id="preview-small"
                class="profile-preview-circle preview-small"
                src=""
                alt=""
              />
              <span class="profile-crop-size-label">Liten</span>
            </div>
          </div>

          <div style="display: flex; gap: 0.75rem">
            <button
              class="btn btn-secondary"
              onclick="cancelUpload()"
              style="flex: 1"
            >
              Avbryt
            </button>
            <button
              class="btn btn-primary"
              id="upload-btn"
              onclick="uploadAvatar()"
              style="flex: 1"
            >
              <span id="upload-btn-text">Last opp</span>
              <span id="upload-spinner" style="display: none">⏳</span>
            </button>
          </div>
        </div>

        <!-- Default state -->
        <div
          id="no-crop-section"
          style="text-align: center; margin-top: 1.25rem"
        >
          <button
            class="btn btn-secondary"
            onclick="document.getElementById('avatar-file-input').click()"
          >
            📷 Endre profilbilde
          </button>
          <p
            style="
              color: var(--text-muted);
              font-size: 0.8rem;
              margin-top: 0.6rem;
            "
          >
            Dra bildet for å velge utsnitt før opplasting
          </p>
        </div>

        <!-- Status message -->
        <div
          id="upload-status"
          style="
            display: none;
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
          "
        ></div>
      </div>
    </main>

    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
